spring:
  application:
    name: baseball-ticketing-queue-system
  data:
    redis:
      host: localhost
      port: 6379

queue:
  heartbeat:
    timeout-ms: 30000
    cleanup-interval-ms: 10000
    cleanup-batch-size: 500
  admission:
    interval-ms: 3000
    batch-size: 100
    active-ttl-ms: 600000

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: baseball-ticketing-queue
    audience: baseball-ticketing-follow-up
